<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>צ'אט בינה מלאכותית</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1222; --paper: #0e1829; --card: #121f36; --card2: #182845;
    --line: #243556; --ink: #e9effa; --muted: #8ea0bf; --accent: #2f7cf6; --accent-2: #19b4ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: "Assistant", Arial, sans-serif; color: var(--ink); background: var(--bg);
  }
  header {
    padding: 14px 16px; font-weight: 800; font-size: 1.3rem; text-align: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
  }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; max-width: 800px; width: 100%; margin: 0 auto; }
  .bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
  .me { background: var(--accent); color: #fff; margin-left: auto; border-bottom-right-radius: 3px; }
  .ai { background: var(--card2); border: 1px solid var(--line); margin-right: auto; border-bottom-left-radius: 3px; }
  .wait { color: var(--muted); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--card); }
  form > * { max-width: 800px; }
  textarea {
    flex: 1; font: inherit; font-size: 1rem; color: var(--ink); resize: none; height: 48px;
    padding: 11px 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit; font-weight: 700; color: #fff; border: none; border-radius: 8px; padding: 0 20px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <header>🤖 צ'אט בינה מלאכותית</header>
  <div id="msgs"><div class="bubble ai">שלום! כתבו לי שאלה ואענה.</div></div>
  <form id="form">
    <textarea id="input" placeholder="כתבו שאלה..."></textarea>
    <button id="send">שליחה</button>
  </form>

<script>
  // AI חינמי – לא צריך מפתח
  const AI_URL = "https://text.pollinations.ai/";
  const SYSTEM = "אתה עוזר ידידותי. ענה תמיד בעברית, בצורה ברורה ולא ארוכה מדי.";
  const history = [];
  const $ = id => document.getElementById(id);

  function add(text, cls) {
    const d = document.createElement("div");
    d.className = "bubble " + cls;
    d.textContent = text;
    $("msgs").appendChild(d);
    $("msgs").scrollTop = $("msgs").scrollHeight;
    return d;
  }

  $("form").onsubmit = async e => {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text) return;
    $("input").value = "";
    add(text, "me");
    history.push({ role: "user", content: text });
    const wait = add("חושב...", "ai wait");
    $("send").disabled = true;
    try {
      const r = await fetch(AI_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "openai", messages: [{ role: "system", content: SYSTEM }, ...history.slice(-20)] })
      });
      if (!r.ok) throw new Error(r.status);
      const answer = (await r.text()).trim();
      history.push({ role: "assistant", content: answer });
      wait.textContent = answer;
      wait.classList.remove("wait");
    } catch (err) {
      history.pop();
      wait.textContent = "לא הצלחתי לקבל תשובה. ייתכן שהסינון חוסם את שירות ה-AI (text.pollinations.ai), או שהשירות עמוס. נסו שוב.";
    }
    $("send").disabled = false;
    $("input").focus();
  };
  $("input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
  });
</script>
</body>
</html>
